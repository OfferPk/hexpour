<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HexPour local browser viewport regression</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      #game {
        display: block;
        border: 0;
      }

      #test-result {
        position: fixed;
        left: -10000px;
        top: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="game" title="HexPour local viewport test"></iframe>
    <pre id="test-result" data-status="running">pending</pre>
    <script>
      (() => {
        const frame = document.querySelector('#game');
        const result = document.querySelector('#test-result');
        const params = new URLSearchParams(location.search);
        const width = Number(params.get('width'));
        const height = Number(params.get('height'));
        const runInteractions = params.get('interactions') === '1';
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        function report(status, value) {
          result.dataset.status = status;
          result.textContent = JSON.stringify(value);
        }

        try {
          if (location.hostname !== '127.0.0.1') {
            throw new Error('This browser fixture is loopback-only');
          }
          if (!Number.isInteger(width) || width < 280 || width > 1200 ||
              !Number.isInteger(height) || height < 280 || height > 1200) {
            throw new Error('Invalid test viewport dimensions');
          }

          // Seed only this temporary same-origin Chromium profile; never touch a player save.
          localStorage.setItem(
            'hexpour_v1',
            JSON.stringify({ unlocked: 2, adsRemoved: false, mute: false }),
          );
          localStorage.setItem('hexpour:howto', '1');
          sessionStorage.setItem('hexpour:a2hs', '1');
          frame.style.width = `${width}px`;
          frame.style.height = `${height}px`;
          frame.title = `HexPour ${width} by ${height} local viewport test`;
          frame.src = '/hexpour/';
        } catch (error) {
          report('fail', { message: error?.message || String(error) });
          return;
        }

        async function waitFor(predicate, label, timeoutMs = 7000) {
          const deadline = Date.now() + timeoutMs;
          while (Date.now() < deadline) {
            const value = predicate();
            if (value) return value;
            await wait(40);
          }
          throw new Error(`Timed out waiting for ${label}`);
        }

        function assertVisibleInViewport(element, label, gameWindow) {
          if (!element) throw new Error(`${label} is missing`);
          const rect = element.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0 || rect.left < -1 || rect.top < -1 ||
              rect.right > gameWindow.innerWidth + 1 || rect.bottom > gameWindow.innerHeight + 1) {
            throw new Error(
              `${label} is outside the ${gameWindow.innerWidth}x${gameWindow.innerHeight} viewport`,
            );
          }
          return {
            left: Math.round(rect.left),
            top: Math.round(rect.top),
            width: Math.round(rect.width),
            height: Math.round(rect.height),
          };
        }

        function testBoardCueLegend(gameWindow, gameDocument) {
          const legend = gameDocument.querySelector('.cue-legend');
          const wrapper = gameDocument.querySelector('.play-canvas-wrap');
          const moveStatus = gameDocument.querySelector('.move-status');
          const items = Array.from(legend?.querySelectorAll('.cue-legend-item') || []);
          const labels = items.map((item) => item.textContent.trim());
          const expected = [
            'Selected source — double outline',
            'Legal destination — dashed outline + check',
            'Blocked neighbor — X mark',
            'Blocked cell — diagonal hatch',
          ];
          if (!legend || legend.getAttribute('role') !== 'group' ||
              legend.getAttribute('aria-label') !== 'Board mark legend' ||
              labels.length !== expected.length || labels.some((label, index) => label !== expected[index])) {
            throw new Error(`The accessible board-mark legend is missing or unclear: ${labels.join(' | ')}`);
          }
          if (items.some((item) => item.querySelector('.cue-legend-marker')?.getAttribute('aria-hidden') !== 'true')) {
            throw new Error('Decorative marker swatches must be hidden from assistive technology');
          }

          const legendBounds = assertVisibleInViewport(legend, 'The board-mark legend', gameWindow);
          const legendRect = legend.getBoundingClientRect();
          const canvasRect = wrapper.getBoundingClientRect();
          const statusRect = moveStatus.getBoundingClientRect();
          if (gameWindow.getComputedStyle(legend).position !== 'static' ||
              legendRect.top < statusRect.bottom - 1 || legendRect.bottom > canvasRect.top + 1) {
            throw new Error('The board-mark legend must stay in flow between status and canvas, not cover the board');
          }
          if (canvasRect.height < 100) {
            throw new Error(`The board canvas is too short beneath the legend (${canvasRect.height}px)`);
          }
          return { bounds: legendBounds, canvasHeight: Math.round(canvasRect.height), itemCount: labels.length };
        }

        function canvasFingerprint(context, canvas) {
          const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
          let hash = 2166136261;
          for (let i = 0; i < pixels.length; i += 4) {
            hash = Math.imul(hash ^ pixels[i], 16777619);
            hash = Math.imul(hash ^ pixels[i + 1], 16777619);
            hash = Math.imul(hash ^ pixels[i + 2], 16777619);
            hash = Math.imul(hash ^ pixels[i + 3], 16777619);
          }
          return (hash >>> 0).toString(16);
        }

        function captureCanvas(gameWindow, gameDocument, phase) {
          const wrapper = gameDocument.querySelector('.play-canvas-wrap');
          const canvas = wrapper?.querySelector('canvas');
          const context = canvas?.getContext('2d');
          if (!wrapper || !canvas || !context) {
            throw new Error(`${phase}: play canvas or 2D context is missing`);
          }

          const cssWidth = wrapper.clientWidth;
          const cssHeight = wrapper.clientHeight;
          const scale = Math.min(gameWindow.devicePixelRatio || 1, 2);
          const expectedWidth = Math.floor(cssWidth * scale);
          const expectedHeight = Math.floor(cssHeight * scale);
          const rect = wrapper.getBoundingClientRect();
          if (cssWidth < 1 || cssHeight < 1 || expectedWidth < 1 || expectedHeight < 1) {
            throw new Error(`${phase}: canvas viewport collapsed to zero size`);
          }
          if (rect.left < -1 || rect.top < -1 ||
              rect.right > gameWindow.innerWidth + 1 || rect.bottom > gameWindow.innerHeight + 1) {
            throw new Error(`${phase}: the canvas wrapper is clipped by the game viewport`);
          }
          if (canvas.width !== expectedWidth || canvas.height !== expectedHeight) {
            throw new Error(
              `${phase}: backing size ${canvas.width}x${canvas.height} does not match ` +
              `${expectedWidth}x${expectedHeight} for ${cssWidth}x${cssHeight} CSS pixels`,
            );
          }
          if (canvas.style.width !== `${cssWidth}px` || canvas.style.height !== `${cssHeight}px`) {
            throw new Error(`${phase}: canvas CSS size does not match the wrapper content box`);
          }

          const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
          let paintedPixels = 0;
          for (let alpha = 3; alpha < pixels.length; alpha += 4) {
            if (pixels[alpha] > 0) paintedPixels += 1;
          }
          if (paintedPixels === 0) {
            throw new Error(`${phase}: canvas was blank after the resize/redraw`);
          }

          return {
            phase,
            wrapper: { width: cssWidth, height: cssHeight },
            backing: { width: canvas.width, height: canvas.height },
            paintedPixels,
          };
        }

        async function pauseForKeyboard(stage) {
          result.dataset.status = `awaiting:${stage}`;
          await waitFor(
            () => result.dataset.resume === stage,
            `the real ${stage} keyboard event`,
            9000,
          );
          delete result.dataset.resume;
          result.dataset.status = 'running';
        }

        async function testKeyboardUndoAndHint(gameWindow, gameDocument, details, summary, controls, canvas, context, pendingFrames) {
          const moveStatus = gameDocument.querySelector('.move-status');
          const selectionStatus = gameDocument.querySelector('.screen-reader-status');
          const undo = Array.from(gameDocument.querySelectorAll('.toolbar button')).find(
            (button) => button.textContent.trim() === 'Undo',
          );
          const cellAt = (q, r) => controls.find((button) =>
            button.getAttribute('aria-label')?.startsWith(`Hex cell q ${q}, r ${r}:`),
          );
          const source = cellAt(0, 0);
          const middle = cellAt(1, 0);
          const destination = cellAt(0, 1);
          if (!source || !middle || !destination) {
            throw new Error('Level 2 keyboard fixture cells are missing');
          }
          if (!selectionStatus || selectionStatus.getAttribute('role') !== 'status' ||
              selectionStatus.getAttribute('aria-live') !== 'polite' ||
              selectionStatus.getAttribute('aria-atomic') !== 'true' ||
              selectionStatus.textContent !== '') {
            throw new Error('Source-selection feedback is not a quiet polite live region initially');
          }
          const originalSourceLabel = source.getAttribute('aria-label');
          const originalDestinationLabel = destination.getAttribute('aria-label');
          if (!originalSourceLabel?.includes('red, green, green') ||
              !originalDestinationLabel?.includes('empty')) {
            throw new Error('Level 2 did not load the expected disposable board state');
          }
          if (!moveStatus || !undo || !undo.disabled ||
              undo.getAttribute('aria-label') !== 'Undo. Make a pour to enable.') {
            throw new Error('Undo is not accessibly disabled before the first pour');
          }
          undo.click();
          if (moveStatus.textContent !== 'Pours: 0' || undo.disabled !== true) {
            throw new Error('Activating disabled Undo changed the untouched board');
          }

          summary.focus();
          await waitFor(() => gameDocument.activeElement === summary, 'keyboard focus on the disclosure');
          await pauseForKeyboard('tab-source');
          if (gameDocument.activeElement !== source) {
            throw new Error('Tab did not move focus from the disclosure to the first cell');
          }

          await pauseForKeyboard('enter-source');
          await waitFor(
            () => source.getAttribute('aria-pressed') === 'true' &&
              selectionStatus.textContent ===
                'Selected source: Hex cell q 0, r 0. Available legal destination: Hex cell q 0, r 1.',
            'keyboard source selection and its legal destination announcement',
          );
          if (!source.classList.contains('selected')) {
            throw new Error('Keyboard source selection is missing its visible selected state');
          }
          const selectionAnnouncementBeforeFrame = selectionStatus.textContent;
          const selectionFrame = pendingFrames.shift();
          if (!selectionFrame) {
            throw new Error('No intercepted animation frame was available to verify quiet live-region behavior');
          }
          selectionFrame(gameWindow.performance.now());
          if (selectionStatus.textContent !== selectionAnnouncementBeforeFrame) {
            throw new Error('The source-selection live region changed during an animation frame');
          }

          await pauseForKeyboard('tab-middle');
          if (gameDocument.activeElement !== middle) {
            throw new Error('Tab did not move to the second accessible cell');
          }
          await pauseForKeyboard('tab-destination');
          if (gameDocument.activeElement !== destination) {
            throw new Error('Tab did not move to the adjacent empty destination');
          }

          await pauseForKeyboard('enter-destination');
          await waitFor(
            () => moveStatus?.textContent === 'Pours: 1' && selectionStatus.textContent === '',
            'the first legal keyboard pour and cleared source selection',
          );
          if (undo.disabled || undo.getAttribute('aria-label') !== 'Undo last pour.') {
            throw new Error('Undo did not become enabled and accessible after a pour');
          }
          const poursAfterMove = moveStatus.textContent;
          if (gameDocument.querySelector('.screen.win.active')) {
            throw new Error('The two-pour Level 2 puzzle unexpectedly completed after one pour');
          }
          if (source.getAttribute('aria-label')?.includes('red.') !== true ||
              !destination.getAttribute('aria-label')?.includes('green, green')) {
            throw new Error('Keyboard destination did not receive the source color run');
          }

          source.focus();
          await waitFor(() => gameDocument.activeElement === source, 'keyboard focus back on the source');
          await pauseForKeyboard('enter-next-source');
          const updatedDestinationAnnouncement =
            'Selected source: Hex cell q 0, r 0. Available legal destination: Hex cell q 1, r 0.';
          await waitFor(
            () => source.getAttribute('aria-pressed') === 'true' &&
              selectionStatus.textContent === updatedDestinationAnnouncement,
            'the changed legal destination after the board state changes',
          );
          await pauseForKeyboard('enter-deselect-source');
          await waitFor(
            () => source.getAttribute('aria-pressed') === 'false' && selectionStatus.textContent === '',
            'keyboard source deselection without stale destination feedback',
          );

          const hint = Array.from(gameDocument.querySelectorAll('.toolbar button')).find(
            (button) => button.getAttribute('aria-label') === 'Hint. One free hint remaining.',
          );
          if (!hint) throw new Error('Hint control is missing');
          if (hint.textContent.trim() !== 'Hint: free') {
            throw new Error('The Hint button does not show that its next use is free');
          }
          assertVisibleInViewport(hint, 'The free Hint control', gameWindow);

          undo.focus();
          await pauseForKeyboard('enter-undo');
          await waitFor(
            () => moveStatus?.textContent === 'Pours: 0' &&
              source.getAttribute('aria-label') === originalSourceLabel &&
              destination.getAttribute('aria-label') === originalDestinationLabel,
            'Undo to restore the exact Level 2 board',
          );
          const poursAfterUndo = moveStatus.textContent;
          if (!undo.disabled || undo.getAttribute('aria-label') !== 'Undo. Make a pour to enable.') {
            throw new Error('Undo remained enabled after its only pour was reversed');
          }
          undo.click();
          if (moveStatus.textContent !== 'Pours: 0') {
            throw new Error('Activating disabled Undo after reversal changed the board');
          }

          const flushFrame = () => {
            const callback = pendingFrames.shift();
            if (!callback) throw new Error('No intercepted animation frame was available to redraw Hint');
            callback(gameWindow.performance.now());
          };
          flushFrame();
          const beforeHint = canvasFingerprint(context, canvas);
          hint.focus();
          await pauseForKeyboard('enter-hint');
          const toast = gameDocument.querySelector('.toast[role="status"]');
          await waitFor(
            () => toast?.textContent === 'Hint highlighted' && toast.classList.contains('show'),
            'accessible Hint feedback',
          );
          if (hint.textContent.trim() !== 'Hint: ad' ||
              hint.getAttribute('aria-label') !== 'Hint. No free hints remain; opens the rewarded-ad prompt.') {
            throw new Error('The Hint button did not explain the rewarded prompt after its free use');
          }
          assertVisibleInViewport(hint, 'The rewarded Hint control', gameWindow);
          assertVisibleInViewport(gameDocument.querySelector('.toolbar'), 'The toolbar after Hint label change', gameWindow);
          assertVisibleInViewport(summary, 'The controls disclosure after Hint label change', gameWindow);
          flushFrame();
          const afterHint = canvasFingerprint(context, canvas);
          if (beforeHint === afterHint) {
            throw new Error('Hint feedback did not change the rendered canvas highlight');
          }

          const restart = Array.from(gameDocument.querySelectorAll('.toolbar button')).find(
            (button) => button.textContent.trim() === 'Restart',
          );
          if (!restart) throw new Error('Restart control is missing after Hint use');
          source.click();
          destination.click();
          await waitFor(
            () => moveStatus?.textContent === 'Pours: 1',
            'a progressed board before testing Restart',
          );
          const progressedSourceLabel = source.getAttribute('aria-label');
          const progressedDestinationLabel = destination.getAttribute('aria-label');
          restart.click();
          const dialog = await waitFor(
            () => gameDocument.querySelector('.overlay.open [role="dialog"]'),
            'the restart confirmation dialog after a pour',
          );
          const keepPlaying = Array.from(dialog.querySelectorAll('button')).find(
            (button) => button.textContent.trim() === 'Keep playing',
          );
          if (dialog.getAttribute('aria-modal') !== 'true' ||
              dialog.getAttribute('aria-labelledby') !== 'restart-title' ||
              dialog.getAttribute('aria-describedby') !== 'restart-description' ||
              dialog.querySelector('#restart-description')?.textContent !==
                'You have made 1 pour. Restarting will discard the current board and start Level 2 over.' ||
              gameDocument.activeElement !== keepPlaying || !keepPlaying) {
            throw new Error('Restart confirmation is not clearly described or safely focused');
          }
          keepPlaying.click();
          await waitFor(
            () => !gameDocument.querySelector('.overlay.open [role="dialog"]'),
            'Keep playing to close the restart confirmation',
          );
          if (moveStatus.textContent !== 'Pours: 1' ||
              source.getAttribute('aria-label') !== progressedSourceLabel ||
              destination.getAttribute('aria-label') !== progressedDestinationLabel ||
              hint.textContent.trim() !== 'Hint: ad' || gameDocument.activeElement !== restart) {
            throw new Error('Canceling Restart changed the board, Hint state, or focus');
          }

          restart.click();
          const confirmDialog = await waitFor(
            () => gameDocument.querySelector('.overlay.open [role="dialog"]'),
            'the restart confirmation dialog on the second attempt',
          );
          const confirmRestart = Array.from(confirmDialog.querySelectorAll('button')).find(
            (button) => button.textContent.trim() === 'Restart level',
          );
          if (!confirmRestart) throw new Error('Confirm Restart action is missing');
          confirmRestart.click();
          await waitFor(
            () => gameDocument.querySelector('.move-status')?.textContent === 'Pours: 0' &&
              Array.from(gameDocument.querySelectorAll('.toolbar button')).some(
                (button) => button.textContent.trim() === 'Hint: free',
              ),
            'Restart confirmation to restore the level and free Hint',
          );
          const restartedCell = (q, r) => Array.from(
            gameDocument.querySelectorAll('details.accessible-board button.cell-control'),
          ).find((button) => button.getAttribute('aria-label')?.startsWith(`Hex cell q ${q}, r ${r}:`));
          const resetSource = restartedCell(0, 0);
          const resetDestination = restartedCell(0, 1);
          const resetUndo = Array.from(gameDocument.querySelectorAll('.toolbar button')).find(
            (button) => button.textContent.trim() === 'Undo',
          );
          const restartedSummary = gameDocument.querySelector('.accessible-board > summary');
          if (gameDocument.querySelector('.overlay.open [role="dialog"]') ||
              resetSource?.getAttribute('aria-label') !== originalSourceLabel ||
              resetDestination?.getAttribute('aria-label') !== originalDestinationLabel ||
              !resetUndo?.disabled || gameDocument.activeElement !== restartedSummary) {
            throw new Error('Confirming Restart did not restore the board and keyboard focus');
          }

          return {
            keyboardTabEnterSource: 'passed',
            keyboardTabEnterAdjacentDestination: 'passed',
            selectedSourceAnnouncement: 'Selected source q 0, r 0',
            firstLegalDestination: 'q 0, r 1',
            updatedLegalDestination: 'q 1, r 0',
            animationFramePreservesSelectionAnnouncement: true,
            keyboardSourceDeselectionClearsAnnouncement: true,
            poursAfterMove,
            poursAfterUndo,
            undoDisabledBeforePour: true,
            undoEnabledAfterPour: true,
            undoDisabledAfterUndo: true,
            keyboardUndoRestoredBoard: poursAfterUndo === 'Pours: 0',
            keyboardHintStatus: toast.textContent,
            hintChangedCanvas: true,
            restartPromptAfterPour: true,
            cancelRestartPreservesBoardAndFocus: true,
            confirmRestartRestoresBoard: true,
          };
        }

        async function testProgressNavigation(gameWindow, gameDocument) {
          const backToLevels = () => gameDocument.querySelector(
            '#play.screen.active .topbar button[aria-label="Back to levels"]',
          );
          const levelButton = (id) => Array.from(
            gameDocument.querySelectorAll('#levels.screen.active .level-btn'),
          ).find((button) => button.textContent.trim() === String(id));
          const activeCell = (q, r) => Array.from(
            gameDocument.querySelectorAll('#play.screen.active details.accessible-board button.cell-control'),
          ).find((button) => button.getAttribute('aria-label')?.startsWith(`Hex cell q ${q}, r ${r}:`));
          const waitForLevelTwo = (pours) => waitFor(
            () => gameDocument.querySelector('#play.screen.active .topbar .title')?.textContent.trim() === 'Level 2' &&
              gameDocument.querySelector('#play.screen.active .move-status')?.textContent === `Pours: ${pours}`,
            `Level 2 to show ${pours} pours`,
          );

          if (gameDocument.querySelector('#play.screen.active .move-status')?.textContent !== 'Pours: 0') {
            throw new Error('Navigation regression must begin on a fresh Level 2 board');
          }
          const initialBack = backToLevels();
          if (!initialBack) {
            throw new Error(`Back-to-levels control is missing on ${gameDocument.querySelector('#play')?.className || 'no play screen'}`);
          }
          initialBack.click();
          if (!gameDocument.querySelector('#levels.screen.active')) {
            throw new Error(`Back-to-levels click did not activate Levels; active screens: ${Array.from(gameDocument.querySelectorAll('.screen.active')).map((screen) => screen.className).join(', ')}`);
          }
          await waitFor(() => levelButton(2), 'the Level 2 selector after a safe back action');
          if (gameDocument.querySelector('.overlay.open [role="dialog"]')) {
            throw new Error('Back to levels prompted even though no board progress would be lost');
          }
          levelButton(2).click();
          await waitForLevelTwo(0);
          if (gameDocument.querySelector('.overlay.open [role="dialog"]')) {
            throw new Error('Returning to the same untouched level showed a redundant prompt');
          }

          const details = gameDocument.querySelector('#play.screen.active details.accessible-board');
          const summary = details?.querySelector('summary');
          if (!details || !summary) throw new Error('Level 2 accessible controls are missing');
          if (!details.open) summary.click();
          await waitFor(() => details.open, 'the Level 2 accessible cell controls');
          const source = activeCell(0, 0);
          const destination = activeCell(0, 1);
          if (!source || !destination) throw new Error('Level 2 navigation test cells are missing');
          source.click();
          destination.click();
          await waitForLevelTwo(1);
          const progressedLabels = [
            activeCell(0, 0)?.getAttribute('aria-label'),
            activeCell(0, 1)?.getAttribute('aria-label'),
          ];

          backToLevels()?.click();
          await waitFor(() => levelButton(2), 'the level selector after leaving a progressed board');
          if (gameDocument.querySelector('.overlay.open [role="dialog"]')) {
            throw new Error('Back to levels prompted even though it preserves the in-memory board');
          }
          levelButton(2).click();
          await waitForLevelTwo(1);
          if ([activeCell(0, 0)?.getAttribute('aria-label'), activeCell(0, 1)?.getAttribute('aria-label')]
            .some((label, index) => label !== progressedLabels[index])) {
            throw new Error('Selecting the same level did not resume its in-progress board');
          }

          backToLevels()?.click();
          await waitFor(() => levelButton(2), 'the selector before returning through Home');
          gameDocument.querySelector('#levels.screen.active .topbar button[aria-label="Back to home"]')?.click();
          await waitFor(() => gameDocument.querySelector('#home.screen.active'), 'Home after backing out of the level selector');
          const play = Array.from(gameDocument.querySelectorAll('#home.screen.active button')).find(
            (button) => button.textContent.trim() === 'Play',
          );
          if (!play) throw new Error('Home Play control is missing');
          play.click();
          await waitForLevelTwo(1);
          if (gameDocument.querySelector('.overlay.open [role="dialog"]') ||
              [activeCell(0, 0)?.getAttribute('aria-label'), activeCell(0, 1)?.getAttribute('aria-label')]
                .some((label, index) => label !== progressedLabels[index])) {
            throw new Error('Home → Play silently discarded the in-progress Level 2 board');
          }

          backToLevels()?.click();
          await waitFor(() => levelButton(1), 'Level 1 as an alternate unlocked choice');
          levelButton(1).click();
          const dialog = await waitFor(
            () => gameDocument.querySelector('.overlay.open [role="dialog"]'),
            'a level-change confirmation before replacing progress',
          );
          const keepPlaying = Array.from(dialog.querySelectorAll('button')).find(
            (button) => button.textContent.trim() === 'Keep playing',
          );
          const description = dialog.querySelector('#level-change-description');
          if (dialog.getAttribute('aria-modal') !== 'true' ||
              dialog.getAttribute('aria-labelledby') !== 'level-change-title' ||
              dialog.getAttribute('aria-describedby') !== 'level-change-description' ||
              description?.textContent !==
                'You have made 1 pour in Level 2. Switching to Level 1 will discard this board.' ||
              gameDocument.activeElement !== keepPlaying || !keepPlaying) {
            throw new Error('Level-change confirmation is not accessible, specific, or initially focused');
          }
          keepPlaying.click();
          await waitForLevelTwo(1);
          if (gameDocument.querySelector('.overlay.open [role="dialog"]') ||
              [activeCell(0, 0)?.getAttribute('aria-label'), activeCell(0, 1)?.getAttribute('aria-label')]
                .some((label, index) => label !== progressedLabels[index]) ||
              gameDocument.activeElement !== gameDocument.querySelector('#play.screen.active .accessible-board > summary')) {
            throw new Error('Canceling a level change did not preserve and restore the active board');
          }

          backToLevels()?.click();
          await waitFor(() => levelButton(1), 'Level 1 before confirming a level change');
          levelButton(1).click();
          const confirmDialog = await waitFor(
            () => gameDocument.querySelector('.overlay.open [role="dialog"]'),
            'the second level-change confirmation',
          );
          const changeLevel = Array.from(confirmDialog.querySelectorAll('button')).find(
            (button) => button.textContent.trim() === 'Change level',
          );
          if (!changeLevel) throw new Error('Confirm level-change action is missing');
          changeLevel.click();
          await waitFor(
            () => gameDocument.querySelector('#play.screen.active .topbar .title')?.textContent.trim() === 'Level 1' &&
              gameDocument.querySelector('#play.screen.active .move-status')?.textContent === 'Pours: 0' &&
              !gameDocument.querySelector('.overlay.open [role="dialog"]'),
            'the confirmed fresh Level 1 board',
          );

          const levelOneDetails = gameDocument.querySelector('#play.screen.active details.accessible-board');
          const levelOneSummary = levelOneDetails?.querySelector('summary');
          if (levelOneDetails && levelOneSummary && !levelOneDetails.open) levelOneSummary.click();
          await waitFor(() => levelOneDetails?.open, 'Level 1 accessible cell controls');
          const levelOneSource = activeCell(0, 0);
          const levelOneTarget = activeCell(0, 1);
          if (!levelOneSource || !levelOneTarget) throw new Error('Level 1 completion cells are missing');
          levelOneSource.click();
          levelOneTarget.click();
          await waitFor(
            () => gameDocument.querySelector('#win.screen.active'),
            'Level 1 completion before the next-level exit',
          );
          const nextLevel = Array.from(
            gameDocument.querySelectorAll('#win.screen.active button'),
          ).find((button) => button.textContent.trim() === 'Next — Level 2');
          if (!nextLevel) throw new Error('Completed level has no Level 2 continuation control');
          nextLevel.click();
          await waitForLevelTwo(0);
          if (gameDocument.querySelector('.overlay.open [role="dialog"]')) {
            throw new Error('Next level prompted after solved progress was already safely recorded');
          }

          return {
            backNavigationKeepsBoardWithoutPrompt: true,
            sameLevelSelectionResumesProgress: true,
            homePlayResumesProgress: true,
            changingLevelPromptsAccessibly: true,
            cancelPreservesBoardAndFocus: true,
            confirmedChangeStartsChosenLevel: true,
            solvedNextLevelHasNoRedundantPrompt: true,
          };
        }

        async function testKeyboardSelectionAffordances(gameWindow, gameDocument, pendingFrames) {
          const back = gameDocument.querySelector('.topbar button[aria-label="Back to levels"]');
          if (!back) throw new Error('Back to levels control is missing');

          gameWindow.localStorage.setItem(
            'hexpour_v1',
            JSON.stringify({ unlocked: 40, adsRemoved: false, mute: false }),
          );
          back.click();
          const levelEleven = await waitFor(
            () => Array.from(gameDocument.querySelectorAll('.level-btn')).find(
              (button) => button.textContent.trim() === '11',
            ),
            'Level 11 in the disposable level list',
          );
          levelEleven.click();
          await waitFor(
            () => gameDocument.querySelector('#play.screen.active .topbar .title')?.textContent.trim() === 'Level 11' &&
              gameDocument.querySelector('details.accessible-board'),
            'Level 11 keyboard controls',
          );

          const details = gameDocument.querySelector('details.accessible-board');
          const summary = details.querySelector('summary');
          if (!details.open) summary.click();
          await waitFor(() => details.open, 'the Level 11 cell controls disclosure');
          const controls = Array.from(details.querySelectorAll('button.cell-control'));
          const cellAt = (q, r) => controls.find((button) =>
            button.getAttribute('aria-label')?.startsWith(`Hex cell q ${q}, r ${r}:`),
          );
          const source = cellAt(0, 0);
          const legal = cellAt(1, -1);
          const blocked = cellAt(-1, 1);
          const selectionStatus = gameDocument.querySelector('.screen-reader-status');
          const canvas = gameDocument.querySelector('.play-canvas-wrap canvas');
          const wrapper = gameDocument.querySelector('.play-canvas-wrap');
          const context = canvas?.getContext('2d');
          if (!source || !legal || !blocked || !selectionStatus || !canvas || !wrapper || !context) {
            throw new Error('Level 11 legal source, target, blocked neighbor, or canvas is missing');
          }
          const scale = Math.min(gameWindow.devicePixelRatio || 1, 2);
          await waitFor(
            () => canvas.width === Math.floor(wrapper.clientWidth * scale) &&
              canvas.height === Math.floor(wrapper.clientHeight * scale),
            'the expanded Level 11 canvas backing size',
          );
          await wait(80);
          const originalSourceLabel = source.getAttribute('aria-label');
          const baselineFrame = pendingFrames.shift();
          if (!baselineFrame) throw new Error('No animation frame was available for the Level 11 baseline');
          baselineFrame(gameWindow.performance.now());
          const baselineCanvas = canvasFingerprint(context, canvas);

          source.focus();
          await waitFor(() => gameDocument.activeElement === source, 'keyboard focus on Level 11 source');
          await pauseForKeyboard('enter-level11-source');
          const expectedAnnouncement =
            'Selected source: Hex cell q 0, r 0. Available legal destinations: ' +
            'Hex cell q 1, r -1, Hex cell q -1, r 0, and Hex cell q 0, r 1. ' +
            'Blocked adjacent cell: Hex cell q -1, r 1.';
          await waitFor(
            () => source.getAttribute('aria-pressed') === 'true' &&
              selectionStatus.textContent === expectedAnnouncement,
            'keyboard source selection with legal and blocked neighboring cells announced',
          );

          if (!source.classList.contains('selected') ||
              !source.getAttribute('aria-label')?.includes('Selected source. Press again to deselect.')) {
            throw new Error('The selected source lacks a non-color or accessible selected-state cue');
          }
          if (!legal.classList.contains('legal-target') || legal.disabled ||
              !legal.getAttribute('aria-label')?.includes('Legal destination from selected source.') ||
              gameWindow.getComputedStyle(legal).borderTopStyle !== 'dashed') {
            throw new Error('A legal destination lacks a distinct non-color destination cue');
          }
          if (!blocked.classList.contains('blocked-target') || !blocked.disabled ||
              !blocked.getAttribute('aria-label')?.includes('Blocked adjacent cell. Cannot be used as a destination.') ||
              gameWindow.getComputedStyle(blocked).borderTopStyle !== 'double') {
            throw new Error('A blocked neighbor lacks a distinct blocked-state cue');
          }

          const selectedFrame = pendingFrames.shift();
          if (!selectedFrame) throw new Error('No animation frame was available for the selected board');
          selectedFrame(gameWindow.performance.now());
          const selectedCanvas = canvasFingerprint(context, canvas);
          if (selectedCanvas === baselineCanvas) {
            throw new Error('Selecting a source did not visibly mark the canvas targets');
          }

          source.focus();
          await pauseForKeyboard('enter-level11-deselect');
          await waitFor(
            () => source.getAttribute('aria-pressed') === 'false' && selectionStatus.textContent === '',
            'keyboard deselection and cleared live-region feedback',
          );
          if (source.classList.contains('selected') || legal.classList.contains('legal-target') ||
              blocked.classList.contains('blocked-target') ||
              source.getAttribute('aria-label') !== originalSourceLabel) {
            throw new Error('Deselection left a stale source, legal-target, or blocked-target cue');
          }
          const deselectedFrame = pendingFrames.shift();
          if (!deselectedFrame) throw new Error('No animation frame was available after deselection');
          deselectedFrame(gameWindow.performance.now());
          const deselectedCanvas = canvasFingerprint(context, canvas);
          if (deselectedCanvas !== baselineCanvas) {
            throw new Error(
              `Deselecting the source did not restore the unmarked canvas ` +
              `(baseline ${baselineCanvas}, after deselection ${deselectedCanvas}, ` +
              `backing ${canvas.width}x${canvas.height})`,
            );
          }

          return {
            level: 11,
            selectedSource: 'keyboard Enter selects q 0, r 0; nested/double outline and explicit label',
            legalDestination: 'q 1, r -1; dashed boundary, check mark, and legal-target label',
            blockedNeighbor: 'q -1, r 1; hatch/cross, double boundary, and blocked label',
            deselectionClearsAllCues: true,
            canvasReturnsToBaseline: true,
          };
        }

        async function run() {
          await waitFor(
            () => frame.contentWindow && frame.contentDocument?.title === 'HexPour' &&
              Array.from(frame.contentDocument.querySelectorAll('button')).some(
                (button) => button.textContent.trim() === 'Play',
              ),
            'the loaded game home and Play button',
          );
          const gameWindow = frame.contentWindow;
          const gameDocument = frame.contentDocument;
          if (window.innerWidth !== width || window.innerHeight !== height ||
              gameWindow.innerWidth !== width || gameWindow.innerHeight !== height) {
            throw new Error(
              `Expected ${width}x${height}, got parent ${window.innerWidth}x${window.innerHeight} ` +
              `and game ${gameWindow.innerWidth}x${gameWindow.innerHeight}`,
            );
          }

          // Dismiss only standard first-run prompts in this disposable browser profile.
          for (let attempt = 0; attempt < 3; attempt += 1) {
            const gotIt = Array.from(gameDocument.querySelectorAll('button')).find(
              (button) => button.textContent.trim() === 'Got it',
            );
            if (!gotIt) break;
            gotIt.click();
            await wait(80);
          }

          // Hold frames for deterministic resize and Hint redraw assertions.
          const pendingFrames = [];
          let interceptedAnimationFrames = 0;
          gameWindow.requestAnimationFrame = (callback) => {
            pendingFrames.push(callback);
            interceptedAnimationFrames += 1;
            return interceptedAnimationFrames;
          };
          const play = Array.from(gameDocument.querySelectorAll('button')).find(
            (button) => button.textContent.trim() === 'Play',
          );
          if (!play) throw new Error('The home Play button disappeared before the test began');
          play.click();

          await waitFor(
            () => gameDocument.querySelector('details.accessible-board') &&
              gameDocument.querySelector('.play-canvas-wrap canvas') &&
              gameDocument.querySelector('.topbar .title')?.textContent.trim() === 'Level 2',
            'Level 2 canvas and accessible controls',
          );
          const details = gameDocument.querySelector('details.accessible-board');
          const summary = details.querySelector('summary');
          const wrapper = gameDocument.querySelector('.play-canvas-wrap');
          const canvas = wrapper.querySelector('canvas');
          const context = canvas.getContext('2d');
          const toolbar = gameDocument.querySelector('.toolbar');
          if (!summary) throw new Error('Accessible-controls disclosure summary is missing');
          const cellControls = Array.from(details.querySelectorAll('button.cell-control'));
          if (cellControls.length !== 3 || cellControls.some((button) => !button.getAttribute('aria-label'))) {
            throw new Error('Level 2 must expose three labeled accessible cell controls');
          }
          const freeHintButton = Array.from(toolbar.querySelectorAll('button')).find(
            (button) => button.getAttribute('aria-label') === 'Hint. One free hint remaining.',
          );
          if (!freeHintButton || freeHintButton.textContent.trim() !== 'Hint: free') {
            throw new Error('The play screen does not disclose the free Hint before activation');
          }
          const initialToolbarBounds = assertVisibleInViewport(toolbar, 'The toolbar', gameWindow);
          const initialHintBounds = assertVisibleInViewport(freeHintButton, 'The free Hint control', gameWindow);
          const initialSummaryBounds = assertVisibleInViewport(summary, 'The cell-controls summary', gameWindow);
          const initialLegend = testBoardCueLegend(gameWindow, gameDocument);

          await wait(100);
          const collapsedBefore = captureCanvas(gameWindow, gameDocument, 'collapsed-before');
          summary.click();
          await waitFor(
            () => details.open && wrapper.clientHeight < collapsedBefore.wrapper.height &&
              canvas.height === Math.floor(
                wrapper.clientHeight * Math.min(gameWindow.devicePixelRatio || 1, 2),
              ),
            'the expanded-panel canvas resize',
          );
          const expandedSummaryBounds = assertVisibleInViewport(summary, 'The expanded cell-controls summary', gameWindow);
          const expandedLegend = testBoardCueLegend(gameWindow, gameDocument);
          await wait(80);
          const expanded = captureCanvas(gameWindow, gameDocument, 'expanded');

          let interactions = null;
          if (runInteractions) {
            interactions = await testKeyboardUndoAndHint(
              gameWindow,
              gameDocument,
              details,
              summary,
              cellControls,
              canvas,
              context,
              pendingFrames,
            );
            interactions.navigation = await testProgressNavigation(gameWindow, gameDocument);
          }

          const currentDetails = gameDocument.querySelector('details.accessible-board');
          const currentSummary = currentDetails?.querySelector('summary');
          const currentWrapper = gameDocument.querySelector('.play-canvas-wrap');
          const currentCanvas = currentWrapper?.querySelector('canvas');
          if (!currentDetails || !currentSummary || !currentWrapper || !currentCanvas) {
            throw new Error('The restarted level did not rebuild its controls and canvas');
          }
          let collapseReferenceHeight = expanded.wrapper.height;
          if (interactions) {
            currentSummary.click();
            await waitFor(
              () => currentDetails.open && currentWrapper.clientHeight < collapsedBefore.wrapper.height &&
                currentCanvas.height === Math.floor(
                  currentWrapper.clientHeight * Math.min(gameWindow.devicePixelRatio || 1, 2),
                ),
              'the restarted disclosure expansion and canvas resize',
            );
            await wait(80);
            collapseReferenceHeight = captureCanvas(
              gameWindow,
              gameDocument,
              'expanded-after-restart',
            ).wrapper.height;
          }
          currentSummary.click();
          await waitFor(
            () => !currentDetails.open && currentWrapper.clientHeight > collapseReferenceHeight &&
              currentCanvas.height === Math.floor(
                currentWrapper.clientHeight * Math.min(gameWindow.devicePixelRatio || 1, 2),
              ),
            'the collapsed-panel canvas resize',
          );
          await wait(80);
          const collapsedAfter = captureCanvas(gameWindow, gameDocument, 'collapsed-after');

          if (expanded.wrapper.height >= collapsedBefore.wrapper.height) {
            throw new Error('Opening the panel did not shrink the canvas viewport');
          }
          if (collapsedAfter.wrapper.height <= expanded.wrapper.height) {
            throw new Error('Closing the panel did not restore canvas space');
          }
          if (interactions) {
            const restart = Array.from(gameDocument.querySelectorAll('.toolbar button')).find(
              (button) => button.textContent.trim() === 'Restart',
            );
            if (!restart) throw new Error('Restart control is missing after Hint use');
            restart.click();
            if (gameDocument.querySelector('.overlay.open [role="dialog"]')) {
              throw new Error('Restart opened a confirmation despite there being no pours to lose');
            }
            await waitFor(
              () => gameDocument.querySelector('#play.screen.active .topbar .title')?.textContent.trim() === 'Level 2' &&
                gameDocument.querySelector('#play.screen.active .move-status')?.textContent === 'Pours: 0' &&
                Array.from(gameDocument.querySelectorAll('#play.screen.active .toolbar button')).some(
                  (button) => button.getAttribute('aria-label') === 'Hint. One free hint remaining.' &&
                    button.textContent.trim() === 'Hint: free',
                ) &&
                Array.from(gameDocument.querySelectorAll('#play.screen.active .toolbar button')).some(
                  (button) => button.textContent.trim() === 'Undo' && button.disabled &&
                    button.getAttribute('aria-label') === 'Undo. Make a pour to enable.',
                ),
              'Restart to restore the free Hint affordance and disable Undo',
            );
            const resetHintButton = Array.from(gameDocument.querySelectorAll('#play.screen.active .toolbar button')).find(
              (button) => button.getAttribute('aria-label') === 'Hint. One free hint remaining.',
            );
            assertVisibleInViewport(resetHintButton, 'The reset free Hint control', gameWindow);
            interactions.restartRestoresFreeHint = true;
            interactions.restartDisablesUndo = true;
            interactions.selectionAffordances = await testKeyboardSelectionAffordances(
              gameWindow,
              gameDocument,
              pendingFrames,
            );
          }
          if (interceptedAnimationFrames === 0) {
            throw new Error('The play animation loop was not intercepted for deterministic redraw testing');
          }

          report('pass', {
            viewport: `${width}x${height}`,
            level: 'Level 2',
            requestAnimationFramesIntercepted: interceptedAnimationFrames,
            accessibleCellControls: cellControls.length,
            toolbarBounds: initialToolbarBounds,
            hintButtonBounds: initialHintBounds,
            boardLegend: { initial: initialLegend, withControlsExpanded: expandedLegend },
            disclosureBounds: { collapsed: initialSummaryBounds, expanded: expandedSummaryBounds },
            redrawVerifiedByPaintedPixels: true,
            interactions,
            stages: [collapsedBefore, expanded, collapsedAfter],
          });
        }

        run().catch((error) => {
          let child = {};
          try {
            const documentRef = frame.contentDocument;
            child = {
              url: frame.contentWindow?.location?.href || '',
              title: documentRef?.title || '',
              buttons: Array.from(documentRef?.querySelectorAll('button') || [])
                .map((button) => button.textContent.trim())
                .slice(0, 20),
              activeScreens: Array.from(documentRef?.querySelectorAll('.screen.active') || [])
                .map((screen) => screen.id),
              moveStatus: documentRef?.querySelector('#play.screen.active .move-status')?.textContent || '',
              toolbar: Array.from(documentRef?.querySelectorAll('#play.screen.active .toolbar button') || [])
                .map((button) => ({
                  text: button.textContent.trim(),
                  label: button.getAttribute('aria-label'),
                  disabled: button.disabled,
                })),
              text: documentRef?.body?.innerText?.slice(0, 500) || '',
            };
          } catch {
            child = { inaccessible: true };
          }
          report('fail', {
            message: error?.message || String(error),
            stack: String(error?.stack || ''),
            child,
          });
        });
      })();
    </script>
  </body>
</html>
